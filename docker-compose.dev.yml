# Local development — spins up Postgres + Redis alongside the API
services:
  db:
    image: postgres:16-alpine
    container_name: plotbook_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: plotbook_db
      POSTGRES_USER: plotbook_user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: plotbook_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: plotbook_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://plotbook_user:password@db:5432/plotbook_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/app   # hot-reload: maps your local code into the container

volumes:
  pgdata:
