# PlotBook API — nginx reverse proxy (TLS termination)
#
# Install on EC2 at: /etc/nginx/sites-available/plotbook
# Enable with:        sudo ln -s /etc/nginx/sites-available/plotbook /etc/nginx/sites-enabled/
# Then run certbot (see HTTPS-SETUP.md) to obtain the TLS cert and have it
# rewrite/extend this file with the listen 443 + ssl_certificate lines.
#
# Replace api.example.com with your real domain (the A record must point at
# this server's public IP, 13.53.169.16, before requesting a certificate).

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Max upload size — keep in sync with media.py MAX_SIZE_BYTES (10 MB).
    client_max_body_size 12m;

    # Locally-stored media (when MEDIA_STORAGE=local). Once on S3+CDN this
    # block can be removed.
    location /static/uploads/ {
        alias /tmp/plotbook-uploads/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
