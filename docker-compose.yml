# Production — uses external RDS + ElastiCache; app runs in container on EC2
services:
  api:
    build: .
    image: plotbook-api:latest
    container_name: plotbook_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
